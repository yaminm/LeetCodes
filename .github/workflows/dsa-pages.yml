name: Deploy DSA Mastery to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'dsa-mastery/**'
      - '.github/workflows/dsa-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dsa-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate site bundle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          parts=[]
          for i in range(1,7):
              text=Path(f'dsa-mastery/bundle-{i}.js').read_text()
              m=re.search(r"\+'([^']+)';", text)
              assert m, f'bundle-{i}.js malformed'
              parts.append(m.group(1))
          html=gzip.decompress(base64.b64decode(''.join(parts))).decode()
          for marker in ['MISSION CONTROL','COURSE MAP','JAVA DOJO','window.DSA_DATA','search-modal']:
              assert marker in html, f'missing {marker}'
          print(f'Validated redesigned site: {len(html)} chars across {len(parts)} chunks')
          PY
      - name: Upload DSA site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dsa-mastery
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
