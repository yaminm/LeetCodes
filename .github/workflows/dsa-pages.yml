name: Deploy DSA Mastery to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'dsa-mastery/**'
      - '.github/workflows/dsa-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dsa-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Apply responsive QA hotfixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          path = Path('dsa-mastery/index.html')
          wrapper = path.read_text(encoding='utf-8')
          match = re.search(r"atob\('([^']+)'\)", wrapper)
          if not match:
              raise SystemExit('Compressed DSA bundle not found')

          html = gzip.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          html = html.replace('24.09.2026', '01.10.2026')
          html = html.replace('updated: "2026-09-24"', 'updated: "2026-10-01"')

          marker = 'mobile-qa-hotfix'
          if marker not in html:
              css = r'''<style id="mobile-qa-hotfix">
          html,body{max-width:100%;overflow-x:hidden}
          .sidebar{min-width:0}
          .main{min-width:0;width:100%}
          @media(max-width:820px){
            .app-shell{grid-template-columns:minmax(0,1fr)!important;width:100%;max-width:100%}
            .sidebar{position:relative;height:auto;padding:13px 14px;width:100%;max-width:100%;min-width:0;overflow:hidden}
            .sidebar nav{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:4px!important;overflow:visible!important;padding-bottom:3px;max-width:100%;min-width:0}
            .nav-item{white-space:normal!important;width:100%!important;justify-content:center;text-align:center;line-height:1.15;font-size:11px!important;padding:8px 4px!important}
            .main{padding:0 17px 50px;width:100%;max-width:100%;min-width:0}
            .topbar,.top-actions,#content{width:100%;max-width:100%;min-width:0}
            .top-actions input{width:100%!important;max-width:100%;min-width:0}
            .grid.cols-2,.grid.cols-3,.curriculum-grid{grid-template-columns:minmax(0,1fr)!important}
            .today-card{align-items:flex-start;flex-direction:column}
            .detail-header{flex-direction:column-reverse}
            .back{align-self:flex-start}
            .hero,.card,.problem,.dojo-item{max-width:100%;min-width:0}
            .pill,.list li,.answer,.source p,.problem p{overflow-wrap:anywhere;word-break:break-word}
          }
          </style>'''
              html = html.replace('</head>', css + '</head>', 1)

          packed = base64.b64encode(gzip.compress(html.encode('utf-8'), compresslevel=9, mtime=0)).decode('ascii')
          wrapper = wrapper[:match.start(1)] + packed + wrapper[match.end(1):]
          path.write_text(wrapper, encoding='utf-8')
          print(f'Patched DSA site: {len(html)} chars, bundle {len(wrapper)} chars')
          PY

      - name: Upload DSA site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dsa-mastery

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
