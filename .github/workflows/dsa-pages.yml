name: Deploy DSA Mastery to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'dsa-mastery/**'
      - '.github/workflows/dsa-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dsa-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload DSA site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dsa-mastery

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
