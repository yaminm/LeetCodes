name: Deploy DSA Mastery to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'dsa-mastery/**'
      - '.github/workflows/dsa-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dsa-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate generated site bundle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          parts = []
          for i in range(1, 7):
              text = Path(f'dsa-mastery/bundle-{i}.js').read_text(encoding='utf-8')
              match = re.search(r"\+'([^']+)';", text)
              assert match, f'Bundle part {i} is malformed'
              parts.append(match.group(1))

          html = gzip.decompress(base64.b64decode(''.join(parts))).decode('utf-8')
          assert 'DSA Interview Mastery' in html
          assert 'window.DSA_DATA' in html
          assert '01.10.2026' in html
          assert 'grid-template-columns:repeat(3,minmax(0,1fr))' in html
          assert 'overflow-x:hidden' in html
          print(f'Validated DSA site bundle: {len(html)} HTML chars across {len(parts)} parts')
          PY

      - name: Upload DSA site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dsa-mastery

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
